    <title>Beamio — Stablecoin Pay App on Base</title>
    <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000414;
    }

    /* 🚩 建议把 #root 也拉满高，否则 React 里还要再写一次 */
    #root {
      height: 100%;
    }

    /* 骨架屏样式 */
    .initModule {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      animation: fadeIn 0.3s ease-in;
      background: #000414;
    }

    .round {
      display: flex;
      width: 132px;
      height: 132px;
      overflow: hidden;
    }

    .round img {
      width: 132px;
      height: 132px;
      object-fit: contain;
    }

    .launching {
      font-size: 14px;
      text-align: center;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      color: #f1f1f1;
    }
  </style>
</head>

<body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root" style="height:100%">
        <div class="initModule">
            <div class="round">
				<img src = "%PUBLIC_URL%/beamio-launch.png" />
			</div>
        </div> 
		
    </div>
	<div id="overlay-root"></div>
</body>
