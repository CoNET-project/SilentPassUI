<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Web site created using create-react-app" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Beamio — Stablecoin Pay App on Base</title>
    <style>
        html,body {margin:0;width: 100%;height:100%;background: #0D0D0D;} 
        /* 骨架屏样式 */
        .initModule{
            width: 100%;
            height:100%;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            animation: fadeIn 0.3s ease-in;
        }
        .round{
            display:flex;
            width: 20vh;
            height: 20vh;
            min-width: 100px;
            min-height: 100px;
            border-radius: 50%;
            overflow: hidden;
        }
        .round img{
            width: 20vh;
            height: 20vh;
            min-width: 100px;
            min-height: 100px;
        }
        .launching{
            font-size: 14px;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 15px 0 0;
            color: #f1f1f1;
        }
    </style>
</head>

<body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root" style="height:100%">
        <div class="initModule">
            <div class="round">
				<img src = "%PUBLIC_URL%/logo192.png" />
			</div>
            <div class="launching">Launching...</div>
        </div> 
    </div>
</body>

</html>
