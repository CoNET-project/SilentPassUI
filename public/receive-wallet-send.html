<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta
		name="viewport"
		content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
	/>
	<meta name="theme-color" content="#f8f9fa" />
	<title>Sign USDC for Beamio</title>
	<style>
		:root {
			--bg: #f4f6f8;
			--card: #ffffff;
			--text: #0f172a;
			--muted: #64748b;
			--accent: #0051d1;
			--border: #e2e8f0;
			--ok: #059669;
			--warn: #b45309;
		}
		* { box-sizing: border-box; }
		html, body {
			margin: 0;
			min-height: 100%;
			background: var(--bg);
			color: var(--text);
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
			-webkit-text-size-adjust: 100%;
			touch-action: pan-x pan-y;
		}
		main {
			max-width: 28rem;
			margin: 0 auto;
			padding: max(1.25rem, env(safe-area-inset-top, 0px)) 1.25rem max(1.5rem, env(safe-area-inset-bottom, 0px));
		}
		h1 {
			margin: 0 0 0.35rem;
			font-size: 1.35rem;
			font-weight: 700;
			letter-spacing: -0.02em;
		}
		.sub {
			margin: 0 0 1.25rem;
			color: var(--muted);
			font-size: 0.95rem;
			line-height: 1.45;
		}
		.card {
			background: var(--card);
			border: 1px solid var(--border);
			border-radius: 1rem;
			padding: 1rem 1.1rem;
			margin-bottom: 1rem;
		}
		.row-label {
			font-size: 0.75rem;
			font-weight: 600;
			letter-spacing: 0.04em;
			text-transform: uppercase;
			color: var(--muted);
			margin-bottom: 0.35rem;
		}
		.amount {
			font-size: 1.75rem;
			font-weight: 700;
			letter-spacing: -0.03em;
			word-break: break-all;
		}
		.addr {
			font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
			font-size: 0.9rem;
			line-height: 1.45;
			word-break: break-all;
		}
		#status {
			min-height: 1.35rem;
			margin: 0 0 1rem;
			font-size: 0.9rem;
			line-height: 1.4;
			color: var(--muted);
		}
		#status.ok { color: var(--ok); }
		#status.err { color: var(--warn); }
		button {
			display: block;
			width: 100%;
			border: 0;
			border-radius: 999px;
			padding: 0.95rem 1.25rem;
			font-size: 1rem;
			font-weight: 650;
			color: #fff;
			background: var(--accent);
			cursor: pointer;
		}
		button:disabled {
			opacity: 0.55;
			cursor: not-allowed;
		}
		.hint {
			margin-top: 0.85rem;
			font-size: 0.8rem;
			color: var(--muted);
			line-height: 1.4;
		}
	</style>
</head>
<body>
	<main>
		<h1>Sign USDC transfer</h1>
		<p class="sub">Sign an authorization in your wallet. Beamio submits the Base USDC transfer — you do not pay gas here.</p>
		<div class="card">
			<div class="row-label">Amount</div>
			<div class="amount" id="amountLabel">—</div>
		</div>
		<div class="card">
			<div class="row-label">To (Beamio EOA)</div>
			<div class="addr" id="toLabel">—</div>
		</div>
		<p id="status">Preparing signature…</p>
		<button type="button" id="sendBtn" disabled>Sign and return to Beamio</button>
		<p class="hint">After you sign, you return to Beamio automatically. Your Main Wallet USDC updates when Beamio confirms the transfer.</p>
	</main>
	<script>
		(function () {
			var USDC = '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
			var BASE_HEX = '0x2105'
			var BASE_CHAIN_ID = 8453
			var AUTH_TTL_SEC = 3600

			var params = new URLSearchParams(window.location.search)
			var toRaw = (params.get('to') || '').trim()
			var amount6Raw = (params.get('amount6') || '').trim()

			var amountEl = document.getElementById('amountLabel')
			var toEl = document.getElementById('toLabel')
			var statusEl = document.getElementById('status')
			var btn = document.getElementById('sendBtn')

			function setStatus(text, kind) {
				statusEl.textContent = text
				statusEl.className = kind || ''
			}

			function isAddress(v) {
				return /^0x[0-9a-fA-F]{40}$/.test(v)
			}

			function formatUsdc(amount6) {
				var s = amount6.toString()
				if (s.length <= 6) {
					s = ('000000' + s).slice(-6)
					return '0.' + s
				}
				var whole = s.slice(0, -6)
				var frac = s.slice(-6).replace(/0+$/, '')
				return frac ? whole + '.' + frac : whole
			}

			function randomBytes32() {
				var bytes = new Uint8Array(32)
				if (window.crypto && window.crypto.getRandomValues) {
					window.crypto.getRandomValues(bytes)
				} else {
					for (var i = 0; i < 32; i++) bytes[i] = Math.floor(Math.random() * 256)
				}
				var hex = ''
				for (var j = 0; j < bytes.length; j++) {
					hex += ('0' + bytes[j].toString(16)).slice(-2)
				}
				return '0x' + hex
			}

			function bytesToBase64Url(bytes) {
				var bin = ''
				for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i])
				var b64 = btoa(bin)
				return b64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '')
			}

			function encodeAuthPayload(obj) {
				var json = JSON.stringify(obj)
				var bytes = new TextEncoder().encode(json)
				return bytesToBase64Url(bytes)
			}

			function isNativeShell() {
				try {
					if (window.CashTreesIOS && typeof window.CashTreesIOS === 'object') return true
					if (window.CashTreesAndroid && typeof window.CashTreesAndroid === 'object') return true
					if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.CashTreesIOS) {
						return true
					}
				} catch (_) {}
				return false
			}

			function returnToBeamio(authB64) {
				var q = 'receiveUsdcAuth=' + encodeURIComponent(authB64)
				var nativeUrl = 'beamio://open?' + q
				var webUrl = 'https://beamio.app/app/?' + q
				setStatus('Signed. Returning to Beamio…', 'ok')
				btn.textContent = 'Returning…'
				btn.disabled = true
				if (isNativeShell()) {
					window.location.href = nativeUrl
					window.setTimeout(function () {
						window.location.href = webUrl
					}, 800)
					return
				}
				window.location.href = webUrl
			}

			if (!isAddress(toRaw)) {
				setStatus('Missing or invalid Beamio wallet address.', 'err')
				amountEl.textContent = '—'
				toEl.textContent = toRaw || '—'
				return
			}
			if (!/^\d+$/.test(amount6Raw) || amount6Raw === '0') {
				setStatus('Missing or invalid USDC amount.', 'err')
				toEl.textContent = toRaw
				return
			}

			var to = toRaw
			var amount6 = amount6Raw
			toEl.textContent = to
			amountEl.textContent = formatUsdc(amount6) + ' USDC'

			function getProvider() {
				return window.ethereum || null
			}

			async function ensureBase(provider) {
				var chainId = ''
				try {
					var raw = await provider.request({ method: 'eth_chainId' })
					chainId = typeof raw === 'string' ? raw.toLowerCase() : ''
				} catch (_) {}
				if (chainId === BASE_HEX) return
				try {
					await provider.request({
						method: 'wallet_switchEthereumChain',
						params: [{ chainId: BASE_HEX }],
					})
				} catch (err) {
					var code = err && err.code
					var nested = err && err.data && err.data.originalError && err.data.originalError.code
					if (code === 4902 || nested === 4902) {
						await provider.request({
							method: 'wallet_addEthereumChain',
							params: [{
								chainId: BASE_HEX,
								chainName: 'Base',
								nativeCurrency: { name: 'Ether', symbol: 'ETH', decimals: 18 },
								rpcUrls: ['https://base-rpc.conet.network'],
								blockExplorerUrls: ['https://basescan.org'],
							}],
						})
						var after = ''
						try {
							var rawAfter = await provider.request({ method: 'eth_chainId' })
							after = typeof rawAfter === 'string' ? rawAfter.toLowerCase() : ''
						} catch (_) {}
						if (after !== BASE_HEX) {
							await provider.request({
								method: 'wallet_switchEthereumChain',
								params: [{ chainId: BASE_HEX }],
							})
						}
					} else {
						throw err
					}
				}
			}

			async function readTokenDomain(provider) {
				var name = 'USD Coin'
				var version = '2'
				try {
					var nameData = '0x06fdde03'
					var nameRaw = await provider.request({
						method: 'eth_call',
						params: [{ to: USDC, data: nameData }, 'latest'],
					})
					if (typeof nameRaw === 'string' && nameRaw.length >= 130) {
						var nameHex = nameRaw.slice(2)
						var offset = parseInt(nameHex.slice(0, 64), 16)
						var len = parseInt(nameHex.slice(offset * 2, offset * 2 + 64), 16)
						var strHex = nameHex.slice(offset * 2 + 64, offset * 2 + 64 + len * 2)
						var decoded = ''
						for (var i = 0; i < strHex.length; i += 2) {
							var c = parseInt(strHex.slice(i, i + 2), 16)
							if (c) decoded += String.fromCharCode(c)
						}
						if (decoded.trim()) name = decoded.trim()
					}
				} catch (_) {}
				try {
					var verData = '0x54fd4d50'
					var verRaw = await provider.request({
						method: 'eth_call',
						params: [{ to: USDC, data: verData }, 'latest'],
					})
					if (typeof verRaw === 'string' && verRaw.length >= 130) {
						var verHex = verRaw.slice(2)
						var vOffset = parseInt(verHex.slice(0, 64), 16)
						var vLen = parseInt(verHex.slice(vOffset * 2, vOffset * 2 + 64), 16)
						var vStrHex = verHex.slice(vOffset * 2 + 64, vOffset * 2 + 64 + vLen * 2)
						var vDecoded = ''
						for (var j = 0; j < vStrHex.length; j += 2) {
							var vc = parseInt(vStrHex.slice(j, j + 2), 16)
							if (vc) vDecoded += String.fromCharCode(vc)
						}
						if (vDecoded.trim()) version = vDecoded.trim()
					}
				} catch (_) {}
				return { name: name, version: version }
			}

			async function sign() {
				var provider = getProvider()
				if (!provider || typeof provider.request !== 'function') {
					setStatus('Open this page inside your wallet to sign.', 'err')
					btn.disabled = false
					btn.textContent = 'Try again'
					return
				}
				btn.disabled = true
				btn.textContent = 'Sign in wallet…'
				setStatus('Requesting signature…')
				try {
					var accounts = await provider.request({ method: 'eth_requestAccounts' })
					var from = Array.isArray(accounts) && typeof accounts[0] === 'string' ? accounts[0] : ''
					if (!isAddress(from)) throw new Error('No wallet account')
					await ensureBase(provider)
					var domainMeta = await readTokenDomain(provider)
					var nowSec = Math.floor(Date.now() / 1000)
					var validAfter = '0'
					var validBefore = String(nowSec + AUTH_TTL_SEC)
					var nonce = randomBytes32()
					var typedData = {
						types: {
							EIP712Domain: [
								{ name: 'name', type: 'string' },
								{ name: 'version', type: 'string' },
								{ name: 'chainId', type: 'uint256' },
								{ name: 'verifyingContract', type: 'address' },
							],
							TransferWithAuthorization: [
								{ name: 'from', type: 'address' },
								{ name: 'to', type: 'address' },
								{ name: 'value', type: 'uint256' },
								{ name: 'validAfter', type: 'uint256' },
								{ name: 'validBefore', type: 'uint256' },
								{ name: 'nonce', type: 'bytes32' },
							],
						},
						primaryType: 'TransferWithAuthorization',
						domain: {
							name: domainMeta.name,
							version: domainMeta.version,
							chainId: BASE_CHAIN_ID,
							verifyingContract: USDC,
						},
						message: {
							from: from,
							to: to,
							value: amount6,
							validAfter: validAfter,
							validBefore: validBefore,
							nonce: nonce,
						},
					}
					var signature = await provider.request({
						method: 'eth_signTypedData_v4',
						params: [from, JSON.stringify(typedData)],
					})
					if (typeof signature !== 'string' || !/^0x[0-9a-fA-F]{130}$/.test(signature)) {
						throw new Error('Invalid signature from wallet')
					}
					var authB64 = encodeAuthPayload({
						from: from,
						to: to,
						value: amount6,
						validAfter: validAfter,
						validBefore: validBefore,
						nonce: nonce,
						signature: signature,
					})
					returnToBeamio(authB64)
				} catch (err) {
					var msg = err && typeof err.message === 'string' ? err.message : ''
					var code = err && err.code
					if (code === 4001 || /user rejected|user denied|rejected the request/i.test(msg)) {
						setStatus('Signature rejected. Tap below to try again.', 'err')
					} else {
						setStatus(msg || 'Could not sign. Tap below to try again.', 'err')
					}
					btn.disabled = false
					btn.textContent = 'Sign and return to Beamio'
				}
			}

			btn.disabled = false
			btn.textContent = 'Sign and return to Beamio'
			btn.addEventListener('click', function () { void sign() })

			var tries = 0
			function maybeAuto() {
				tries += 1
				if (getProvider()) {
					void sign()
					return
				}
				if (tries < 40) {
					window.setTimeout(maybeAuto, 150)
				} else {
					setStatus('Tap below to sign in your wallet.', '')
				}
			}
			window.setTimeout(maybeAuto, 80)
		})()
	</script>
</body>
</html>
