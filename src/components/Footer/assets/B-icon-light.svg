<svg width="120" height="120" viewBox="0 0 120 120"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- 浅色“微凸”圆形 -->
    <radialGradient id="lightGlossyCircle" cx="30%" cy="25%" r="75%">
      <stop offset="0%"  stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#F5F5F5"/>
      <stop offset="75%" stop-color="#E5E7EB"/>
      <stop offset="100%" stop-color="#D4D4D8"/>
    </radialGradient>

    <!-- 左上高光 -->
    <radialGradient id="lightHighlightGrad" cx="0%" cy="0%" r="100%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="35%"  stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- 底部小面积反光（缩小 50%+） -->
    <radialGradient id="bottomShadowGrad" cx="50%" cy="100%" r="80%">
      <stop offset="0%"   stop-color="#9CA3AF" stop-opacity="0.35"/>
      <stop offset="60%"  stop-color="#9CA3AF" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#9CA3AF" stop-opacity="0.0"/>
    </radialGradient>

    <!-- B 的蓝色动态渐变 -->
    <linearGradient id="beamio-B-anim-light" x1="0%" y1="0%" x2="100%">
      <stop offset="0%" stop-color="#0031CC" />
      <stop offset="50%" stop-color="#4C8DFF">
        <animate attributeName="offset" values="0;1;0" dur="2.2s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0031CC" />
    </linearGradient>

    <clipPath id="lightCircleClip">
      <circle cx="60" cy="60" r="56" />
    </clipPath>
  </defs>

  <!-- 主体浅色凸起圆 -->
  <circle
    cx="60" cy="60" r="56"
    fill="url(#lightGlossyCircle)"
    stroke="#E5E7EB"
    stroke-width="1"
  />

  <!-- 底部反光（缩小 50%+） -->
  <g clip-path="url(#lightCircleClip)">
    <ellipse
      cx="60" cy="80"
      rx="22" ry="9"
      fill="url(#bottomShadowGrad)"
    />
  </g>

  <!-- 左上高光 -->
  <g clip-path="url(#lightCircleClip)">
    <ellipse
      cx="34" cy="22"
      rx="30" ry="16"
      fill="url(#lightHighlightGrad)"
    />
  </g>

  <!-- 中央的 B -->
  <text
    x="62" y="87"
    text-anchor="middle"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif"
    font-size="72"
    font-weight="700"
    font-style="italic"
    letter-spacing="0.02em"
    fill="url(#beamio-B-anim-light)"
  >
    B
  </text>
</svg>
