<style>
        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
        }
        .primary-gradient {
            background: linear-gradient(135deg, #004bc3 0%, #1562f0 100%);

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

    body {
      min-height: max(884px, 100dvh);

<body class="bg-surface-container-low font-body text-on-surface min-h-screen flex flex-col overflow-x-hidden">
<!-- TopAppBar Execution -->
<header class="flex items-center justify-between px-6 py-4 w-full sticky top-0 z-50 bg-[#f9f9fe]/70 backdrop-blur-lg shadow-[0_4px_24px_rgba(0,0,0,0.04)]">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-[#e8e8ed] transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined text-[#1562f0]" data-icon="arrow_back">arrow_back</span>
</button>
<span class="text-xl font-bold tracking-tighter text-[#1a1c1f]">Verra</span>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<main class="flex-1 max-w-lg mx-auto w-full px-6 py-8 flex flex-col">
<!-- Header Section -->
<div class="mb-10 text-center md:text-left">
<h1 class="text-4xl font-extrabold tracking-tight text-on-surface mb-4">Security Backup</h1>
<p class="text-on-surface-variant text-lg leading-relaxed">
                Your Recovery Code is your master key. If you lose your phone, this is the only way to get your funds back.
            </p>
</div>
<!-- Central Visual: QR Glass Card -->
<section class="mb-10">
<div class="relative group">
<!-- Decorative Glow -->
<div class="absolute inset-0 bg-primary opacity-5 blur-3xl rounded-full"></div>
<div class="glass-card relative rounded-lg p-8 border border-white/40 shadow-sm flex flex-col items-center">
<!-- Dynamic QR Visual Container -->
<div class="w-64 h-64 bg-surface-container-highest rounded-lg flex items-center justify-center p-4 mb-6">
<img alt="Recovery QR Code" class="w-full h-full object-contain mix-blend-multiply opacity-90" data-alt="Modern high-tech recovery QR code with blue glowing accents and minimalist vector patterns on white background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCO92yJ-tLAlp0XpIliBVhr_B7AquwTNqIr3m8IjFO3zO00asWHBp2Ull-aVwlyv2lpPKC4JI-tLn-IXyIqnmjiQgedZK0Ee-F_qRZ9S4Lq7F_usC-Fh4YnA78kvHu4vORCRUhqZz6GvVrMX3edcoM3oCl8UOSFglXKN36Bj160zi0BONJlhVoIB6ElzJwX-wpyaWdjs5KnWv6_vl7VFXGxRhJn3CVeNHSnDo7nZpwfL9IyKkX_GW_euxCqX-oykmdvMOiG0PoFNIf_"/>
</div>
<!-- Recovery Code Display -->
<div class="bg-surface-container-low w-full rounded-md p-4 flex items-center justify-between">
<span class="font-mono text-sm tracking-widest text-on-surface uppercase select-all">VRA-9X2L-44BK-9922</span>
<span class="material-symbols-outlined text-primary text-sm" data-icon="enhanced_encryption" style="font-variation-settings: 'FILL' 1;">enhanced_encryption</span>
</div>
</div>
</div>
</section>
<!-- Action Grid -->
<div class="grid grid-cols-1 gap-4 mb-10">
<button class="primary-gradient text-white font-bold py-4 px-8 rounded-full flex items-center justify-center gap-3 shadow-md active:scale-95 transition-transform">
<span class="material-symbols-outlined" data-icon="download">download</span>
                Save to Photos
            </button>
<button class="bg-surface-container-high text-on-surface font-bold py-4 px-8 rounded-full flex items-center justify-center gap-3 hover:bg-surface-container-highest active:scale-95 transition-transform">
<span class="material-symbols-outlined" data-icon="content_copy">content_copy</span>
                Copy Recovery Code
            </button>
</div>
<!-- Compliance Checkbox -->
<div class="mt-auto mb-8 bg-surface-container-lowest/50 p-6 rounded-lg border border-white/20">
<label class="flex items-start gap-4 cursor-pointer group">
<div class="relative flex items-center justify-center mt-1">
<input class="peer appearance-none w-6 h-6 rounded-md bg-surface-container-highest border-none checked:bg-primary transition-colors cursor-pointer" type="checkbox"/>
<span class="material-symbols-outlined absolute text-white text-lg scale-0 peer-checked:scale-100 transition-transform pointer-events-none" data-icon="check">check</span>
</div>
<span class="text-on-surface font-medium leading-snug">
                    I have securely saved my recovery code
                </span>
</label>
</div>
<!-- Bottom Primary Action -->
<div class="pb-10">
<button class="w-full bg-primary text-white font-bold py-5 rounded-full flex items-center justify-center gap-2 group hover:shadow-lg active:scale-95 transition-all">
                Next
                <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</main>
<!-- Navigation Shell Suppressed as per Task-Focused/Linear Journey Rule -->
