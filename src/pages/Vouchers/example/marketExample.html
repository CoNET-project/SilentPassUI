<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Terminal Setup - Beamio</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-high": "#dfe3e6",
                        "inverse-primary": "#5f8bff",
                        "error-dim": "#9f0519",
                        "on-primary-container": "#001e59",
                        "background": "#f5f7f9",
                        "tertiary-fixed-dim": "#e88ae1",
                        "surface-dim": "#d0d5d8",
                        "secondary-dim": "#455064",
                        "on-primary": "#f1f2ff",
                        "primary": "#0051d1",
                        "on-primary-fixed-variant": "#00276d",
                        "on-surface-variant": "#595c5e",
                        "surface": "#f5f7f9",
                        "primary-fixed": "#7a9dff",
                        "on-surface": "#2c2f31",
                        "on-error-container": "#570008",
                        "error-container": "#fb5151",
                        "tertiary-fixed": "#f797ef",
                        "on-secondary-container": "#475266",
                        "on-secondary-fixed": "#354053",
                        "on-primary-fixed": "#000000",
                        "surface-bright": "#f5f7f9",
                        "surface-variant": "#d9dde0",
                        "inverse-on-surface": "#9a9d9f",
                        "secondary-fixed": "#d8e3fb",
                        "outline-variant": "#abadaf",
                        "primary-fixed-dim": "#648eff",
                        "tertiary-dim": "#7f2d7e",
                        "surface-container-low": "#eef1f3",
                        "surface-container": "#e5e9eb",
                        "secondary": "#515c70",
                        "tertiary": "#8d3a8b",
                        "surface-tint": "#0051d1",
                        "on-tertiary": "#ffeef8",
                        "secondary-container": "#d8e3fb",
                        "secondary-fixed-dim": "#cad5ed",
                        "error": "#b31b25",
                        "on-tertiary-fixed-variant": "#6c1a6c",
                        "on-secondary": "#eff2ff",
                        "surface-container-highest": "#d9dde0",
                        "outline": "#747779",
                        "on-secondary-fixed-variant": "#515c70",
                        "on-tertiary-container": "#610e62",
                        "tertiary-container": "#f797ef",
                        "inverse-surface": "#0b0f10",
                        "on-tertiary-fixed": "#400041",
                        "surface-container-lowest": "#ffffff",
                        "primary-dim": "#0047b8",
                        "on-error": "#ffefee",
                        "primary-container": "#7a9dff",
                        "on-background": "#2c2f31"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Manrope"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-nav {
            background: rgba(245, 247, 249, 0.7);
            backdrop-filter: blur(20px);
        }
        .mesh-gradient-bg {
            background: radial-gradient(at 0% 0%, #0051d1 0%, transparent 50%),
                        radial-gradient(at 100% 0%, #7a9dff 0%, transparent 50%),
                        radial-gradient(at 50% 100%, #eef1f3 0%, transparent 50%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background font-body text-on-surface antialiased selection:bg-primary/20">
<div class="relative flex min-h-screen w-full flex-col overflow-x-hidden">
<!-- Minimal Task Header (Excluded Shared Nav per Logic 2 & 3) -->
<header class="sticky top-0 z-50 glass-nav flex items-center justify-between px-6 py-4">
<button class="flex h-12 w-12 items-center justify-center rounded-full bg-surface-container-lowest text-on-surface shadow-sm transition-transform active:scale-95">
<span class="material-symbols-outlined">arrow_left</span>
</button>
<span class="text-label-sm font-bold uppercase tracking-widest text-on-surface-variant">Setup Phase 01</span>
<div class="w-12"></div> <!-- Spacer for symmetry -->
</header>
<main class="flex flex-1 flex-col px-6 pb-24 pt-8 max-w-xl mx-auto w-full">
<!-- Hero Illustration / Visual Interest -->
<div class="relative mb-12 h-64 overflow-hidden rounded-xl shadow-2xl">
<div class="absolute inset-0 mesh-gradient-bg opacity-20"></div>
<img class="h-full w-full object-cover mix-blend-overlay" data-alt="Modern sleek point of sale terminal on a minimalist marble counter with soft cinematic lighting and bokeh background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC81jazJ6aagCDIf-YFpCeIgCrQ6ESZEbBv5Wlhpz-yY0JbCRJOXX5EILx6F4d2awTUwfnt3HKK36PRL2-GizaBHdbdkdBmcA0J_5PahS-Wrn3tsths3Vew2IgALnwxo2V2EalIIlIAD1IEyJnKUzntUt7dL2FNyxnUOaa4r2ANMFEWFWf0Mc3lg8C16tIZQMn7naGD0XpVDdT_IXlsL_svhLL1VnmWPAnO7Y2c54AnYUCUvDpbujAbOYd_lgCgp5g0Q1Ea9nLjb8I"/>
<div class="absolute inset-0 bg-gradient-to-t from-background via-transparent to-transparent"></div>
<!-- Floating Glass Card for Visual Depth -->
<div class="absolute bottom-6 left-6 right-6 p-4 rounded-lg bg-surface-container-lowest/40 backdrop-blur-md border border-white/20 flex items-center gap-4">
<div class="flex size-12 items-center justify-center rounded-full bg-primary text-white">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">terminal</span>
</div>
<div>
<p class="text-sm font-bold text-on-surface">SoftPOS Native</p>
<p class="text-xs text-on-surface-variant">v4.2.0 Build Stable</p>
</div>
</div>
</div>
<!-- Content Section -->
<div class="space-y-6">
<div class="space-y-2">
<h1 class="font-headline text-4xl font-extrabold tracking-tight text-on-surface">
                        Link Terminal to <span class="text-primary">Workspace</span>
</h1>
<p class="text-body-md leading-relaxed text-on-surface-variant">
                        Enter your business <span class="font-semibold text-on-surface">@BeamioTag</span> to authorize this device. This secures your transactions and syncs your inventory.
                    </p>
</div>
<!-- Input Component -->
<div class="group flex flex-col gap-2">
<label class="text-sm font-bold text-on-surface-variant ml-1">@BeamioTag</label>
<div class="relative flex items-center transition-all">
<input class="h-16 w-full rounded-lg border-none bg-surface-container-low px-6 font-headline text-lg font-medium text-on-surface placeholder:text-outline-variant focus:bg-surface-container-lowest focus:ring-2 focus:ring-primary/20" placeholder="e.g. coffee_house_ny" type="text"/>
<button class="absolute right-2 flex h-12 w-12 items-center justify-center rounded-lg bg-primary text-white shadow-lg transition-transform active:scale-95">
<span class="material-symbols-outlined">magnification_large</span>
</button>
</div>
</div>
<!-- Verification Status (Simulated State) -->
<div class="flex items-center gap-4 rounded-lg bg-surface-container-low/50 p-4 border border-outline-variant/10">
<div class="flex size-12 items-center justify-center rounded-full bg-primary/10 text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<div class="flex-1">
<p class="font-bold text-on-surface">Verified Workspace</p>
<p class="text-xs text-on-surface-variant">Auth tokens generated for "Coffee House NY"</p>
</div>
<div class="flex size-6 items-center justify-center rounded-full bg-primary-fixed">
<div class="size-2 animate-pulse rounded-full bg-primary"></div>
</div>
</div>
</div>
</main>
<!-- Footer Action (Sticky) -->
<footer class="fixed bottom-0 left-0 right-0 p-6 glass-nav">
<div class="mx-auto max-w-xl">
<button class="flex h-16 w-full items-center justify-between rounded-full bg-primary px-8 text-lg font-bold text-white shadow-2xl shadow-primary/30 transition-all hover:bg-primary-dim active:scale-[0.98]">
<span>Next Phase</span>
<div class="flex items-center gap-2">
<span class="text-sm font-normal opacity-70">Authorize</span>
<span class="material-symbols-outlined">arrow_forward</span>
</div>
</button>
</div>
</footer>
</div>
</body></html>
