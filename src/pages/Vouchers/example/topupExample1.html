<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface": "#f8f9fa",
                        "tertiary": "#973300",
                        "primary-fixed-dim": "#b3c5ff",
                        "on-surface": "#191c1d",
                        "on-primary-container": "#edefff",
                        "inverse-surface": "#2e3132",
                        "surface-container-low": "#f3f4f5",
                        "on-secondary-fixed": "#00184a",
                        "error": "#ba1a1a",
                        "outline": "#737687",
                        "tertiary-fixed": "#ffdbce",
                        "tertiary-fixed-dim": "#ffb59a",
                        "surface-tint": "#0054d8",
                        "on-background": "#191c1d",
                        "surface-dim": "#d9dadb",
                        "on-tertiary-fixed": "#370d00",
                        "error-container": "#ffdad6",
                        "secondary": "#465c99",
                        "primary-fixed": "#dbe1ff",
                        "on-primary-fixed-variant": "#003fa5",
                        "primary-container": "#1562f0",
                        "on-secondary-container": "#344a86",
                        "on-secondary-fixed-variant": "#2e447f",
                        "surface-container-highest": "#e1e3e4",
                        "secondary-fixed-dim": "#b3c5ff",
                        "tertiary-container": "#c04300",
                        "surface-container-high": "#e7e8e9",
                        "surface-variant": "#e1e3e4",
                        "on-tertiary-container": "#ffece6",
                        "outline-variant": "#c3c6d8",
                        "on-primary": "#ffffff",
                        "secondary-fixed": "#dbe1ff",
                        "on-error-container": "#93000a",
                        "surface-bright": "#f8f9fa",
                        "inverse-primary": "#b3c5ff",
                        "surface-container": "#edeeef",
                        "secondary-container": "#a7bcff",
                        "inverse-on-surface": "#f0f1f2",
                        "on-tertiary-fixed-variant": "#802a00",
                        "on-tertiary": "#ffffff",
                        "on-error": "#ffffff",
                        "on-secondary": "#ffffff",
                        "background": "#f8f9fa",
                        "on-primary-fixed": "#00184a",
                        "surface-container-lowest": "#ffffff",
                        "primary": "#004bc3",
                        "on-surface-variant": "#424655"
                    },
                    fontFamily: {
                        "headline": ["Inter"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .qr-gradient-glow {
            background: radial-gradient(circle, rgba(21, 98, 240, 0.08) 0%, rgba(21, 98, 240, 0) 70%);
        }
        .animate-pulse-soft {
            animation: pulse-soft 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse-soft {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-surface font-body text-on-surface antialiased">
<!-- Main Content Underlay (Blurred) -->
<main class="min-h-screen p-6 space-y-8 filter blur-sm">
<header class="flex justify-between items-center">
<h1 class="text-2xl font-bold tracking-tight">Verra Wallet</h1>
<div class="w-10 h-10 rounded-full bg-surface-container-highest"></div>
</header>
<section class="bg-primary-container p-8 rounded-lg text-on-primary-container shadow-xl">
<p class="text-sm opacity-80 mb-2">Global Balance</p>
<h2 class="text-4xl font-extrabold tracking-tight">$12,450.00</h2>
</section>
<section class="grid grid-cols-2 gap-4">
<div class="h-32 bg-surface-container-low rounded-lg"></div>
<div class="h-32 bg-surface-container-low rounded-lg"></div>
</section>
</main>
<!-- Backdrop Overlay -->
<div class="fixed inset-0 bg-black/40 backdrop-blur-md z-[60]"></div>
<!-- Top Up Bottom Sheet Modal -->
<div class="fixed inset-x-0 bottom-0 z-[70] flex flex-col items-center">
<!-- Handle for tactile feel -->
<div class="w-12 h-1.5 bg-white/30 rounded-full mb-3"></div>
<div class="bg-surface-container-lowest w-full max-w-lg rounded-t-xl px-6 pt-10 pb-12 shadow-[0_-20px_50px_rgba(0,0,0,0.1)] flex flex-col items-center">
<!-- Header Text -->
<div class="text-center space-y-2 mb-8">
<h3 class="text-[22px] font-bold text-on-surface tracking-tight">Add Funds at Store</h3>
<p class="text-[15px] text-on-surface-variant leading-relaxed px-8">
                    Show this code to the cashier to top up your Global Balance.
                </p>
</div>
<!-- Receiver QR Container -->
<div class="relative group">
<!-- Outer Glow -->
<div class="absolute inset-0 qr-gradient-glow rounded-xl -m-8"></div>
<!-- Main QR Box -->
<div class="relative w-72 h-72 bg-surface-container-low rounded-lg border-2 border-dashed border-outline-variant p-6 flex flex-col items-center justify-center transition-all duration-500 hover:scale-[1.02]">
<!-- The QR Visual (Brand Blue Blocks) -->
<div class="relative w-48 h-48 grid grid-cols-12 gap-1 p-2 bg-white rounded-md shadow-sm">
<!-- Abstract QR representation using theme primary blocks -->
<div class="col-span-3 h-3 bg-primary-container rounded-sm"></div>
<div class="col-span-1 h-3 bg-primary-container/20 rounded-sm"></div>
<div class="col-span-4 h-3 bg-primary-container rounded-sm"></div>
<div class="col-span-4 h-3 bg-primary-container/40 rounded-sm"></div>
<div class="col-span-2 h-3 bg-primary-container/10 rounded-sm"></div>
<div class="col-span-6 h-3 bg-primary-container rounded-sm"></div>
<div class="col-span-4 h-3 bg-primary-container/60 rounded-sm"></div>
<div class="col-span-8 h-3 bg-primary-container rounded-sm"></div>
<div class="col-span-4 h-3 bg-primary-container/10 rounded-sm"></div>
<!-- Centered Badge -->
<div class="absolute inset-0 flex items-center justify-center">
<div class="w-14 h-14 bg-white rounded-full shadow-lg flex items-center justify-center border-4 border-surface-container-low">
<span class="material-symbols-outlined text-primary-container text-3xl font-bold" data-icon="arrow_downward" style="font-variation-settings: 'FILL' 1;">arrow_downward</span>
</div>
</div>
<!-- More QR blocks -->
<div class="col-span-12 h-3 bg-primary-container/20 rounded-sm"></div>
<div class="col-span-5 h-3 bg-primary-container rounded-sm"></div>
<div class="col-span-7 h-3 bg-primary-container/5 rounded-sm"></div>
<div class="col-span-3 h-3 bg-primary-container rounded-sm"></div>
<div class="col-span-9 h-3 bg-primary-container/30 rounded-sm"></div>
<div class="col-span-6 h-3 bg-primary-container rounded-sm"></div>
<div class="col-span-6 h-3 bg-primary-container rounded-sm"></div>
</div>
<!-- User Handle Tag -->
<div class="mt-6 flex items-center gap-2 px-4 py-1.5 bg-white rounded-full shadow-sm border border-outline-variant/10">
<span class="text-sm font-semibold tracking-wide text-primary">@SarahV</span>
</div>
<!-- Scanning Hint Layer (Magic Moment) -->
<div class="absolute bottom-4 flex items-center gap-2 text-[11px] font-bold text-primary/60 uppercase tracking-widest animate-pulse-soft">
<span class="w-1.5 h-1.5 rounded-full bg-primary"></span>
                        Waiting for scan
                    </div>
</div>
</div>
<!-- Secondary Actions & Footers -->
<div class="mt-10 w-full text-center space-y-6">
<!-- Hint Action -->
<p class="text-sm text-on-surface-variant">Want to deposit USDC? <button class="text-primary font-bold hover:underline underline-offset-4 ml-1">Go to Wallet</button></p>
<!-- Footer Context -->
<!-- Main CTA (Dismiss/Cancel) -->
<button class="w-full bg-surface-container-high py-4 rounded-full font-bold text-on-surface hover:bg-surface-container-highest transition-colors active:scale-95 duration-150">
                    Done
                </button>
</div>
</div>
</div>
<!-- Hidden Success Mockup State (For Design Fidelity Reference) -->
<!-- This structure indicates how the flip would occur visually -->
<div class="sr-only">
<div class="flex flex-col items-center" id="success-state">
<div class="w-20 h-20 bg-green-500 rounded-full flex items-center justify-center mb-4">
<span class="material-symbols-outlined text-white text-4xl" data-icon="check">check</span>
</div>
<h4 class="text-2xl font-bold">+ CA$ 50.00 Added!</h4>
</div>
</div>
</body></html>
